[project]
name = "signal-mcp-server"
version = "1.0.0"
description = "Combined MCP + WebSocket server for Signal music sequencer"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
signal-mcp = "signal_mcp_server:main"
